# Render configuration for CivicApp: backend web service and frontend static site

services:
  - type: web_service
    name: civicapp-backend
    env: node
    plan: free
    branch: main
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    envVars:
      - key: MONGODB_URI
        fromDatabase: null
      - key: JWT_SECRET
        fromDatabase: null
      - key: ADMIN_EMAIL
        fromDatabase: null
      - key: ADMIN_PASSWORD
        fromDatabase: null
      - key: S3_BUCKET
        fromDatabase: null
      - key: AWS_REGION
        fromDatabase: null
      - key: AWS_ACCESS_KEY_ID
        fromDatabase: null
      - key: AWS_SECRET_ACCESS_KEY
        fromDatabase: null

  - type: static_site
    name: civicapp-frontend
    env: node
    plan: free
    branch: main
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://civicapp-backend.onrender.com
